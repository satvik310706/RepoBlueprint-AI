services:
  # ── RepoBlueprint AI Production Web Application ──
  repoblueprint:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_DEFAULT_PROVIDER: ${VITE_DEFAULT_PROVIDER:-ollama}
        VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY:-}
        VITE_GEMINI_MODEL: ${VITE_GEMINI_MODEL:-gemini-2.5-flash}
        VITE_OLLAMA_URL: ${VITE_OLLAMA_URL:-http://localhost:11434}
        VITE_OLLAMA_MODEL: ${VITE_OLLAMA_MODEL:-llama3.2:3b}
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-bgumuh2m}
        VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET:-repo_blueprint}
        VITE_CLOUDINARY_API_KEY: ${VITE_CLOUDINARY_API_KEY:-749746485129813}
    image: repoblueprint-ai:latest
    container_name: repoblueprint-app
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    environment:
      - OLLAMA_HOST=ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Containerized Local Offline LLM Engine (Ollama) ──
  ollama:
    image: ollama/ollama:latest
    container_name: repoblueprint-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  ollama_data:
    driver: local
